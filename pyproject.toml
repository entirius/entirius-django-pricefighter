[project]
name = "entirius-django-pricefighter"
version = "1.0.0"
description = "Competitive pricing engine Django module for Volkanos"
authors = [{ name = "Entirius" }]
maintainers = [
    { name = "Piotr Brzozowski", email = "piotrb@entirius.com" },
    { name = "Paweł Kiełt", email = "cptshooter12@gmail.com" },
    { name = "Mateusz Baran", email = "mateuszbaranpv@gmail.com" },
    { name = "Michał Kloczkowski", email = "michal@kloczkowski.pl" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "pydantic>=2.0",
    "drf-spectacular>=0.27",
    "celery>=5.3",
    "entirius-django-utils>=2.0.0",
    "entirius-django-regional>=2.0.1",
    "entirius-django-pricemanager>=4.2.0",
    "entirius-django-atlas>=2.0.0",
]

[project.optional-dependencies]
pim  = ["entirius-django-pim>=3.0.0"]
dev  = ["ruff", "pre-commit"]
test = [
    "pytest",
    "pytest-django",
    "dj-database-url",
    "psycopg[binary]",
    "entirius-django-pim>=3.0.0",
]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-pricefighter"

# TEMPORARY: both siblings are needed at versions PyPI does not carry yet, so uv resolves
# them from git for development and CI; the published wheel keeps the plain version
# requirements. Delete each entry (and re-lock) once that package is released:
#   entirius-django-atlas        - private repo, never published; CI needs ATLAS_READ_TOKEN.
#   entirius-django-pricemanager - public, but `price_bounds_service` / `price_write_guard`
#                                  land in 4.2.0 and PyPI stops at 4.1.0. No token needed.
[tool.uv.sources]
entirius-django-atlas = { git = "https://github.com/entirius/entirius-django-atlas", branch = "develop" }
entirius-django-pricemanager = { git = "https://github.com/entirius/entirius-django-pricemanager", branch = "develop" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_pricefighter"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["django_pricefighter"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# Soft integration guarded by try/except ImportError (channel/representation sync reads
# django_pim models; no-ops when absent) -> extra "pim".
DEP001 = ["django_pim"]
